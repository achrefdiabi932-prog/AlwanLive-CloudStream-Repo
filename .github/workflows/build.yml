name: Build Alwan Live plugin

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alwanlive-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build CloudStream plugin and repository index
        run: gradle make makePluginsJson --stacktrace

      - name: Prepare repository output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          find . -type f -path '*/build/*.cs3' -exec cp -v {} publish/ \;
          test -n "$(find publish -maxdepth 1 -name '*.cs3' -print -quit)"
          test -f build/plugins.json
          cp build/plugins.json publish/plugins.json
          cp repo.json publish/repo.json
          cat > publish/README.md <<'TXT'
          # Alwan Live repository

          This branch contains the compiled CloudStream plugin and repository index.
          Add this repository URL in CSWeb TV:

          https://raw.githubusercontent.com/achrefdiabi932-prog/AlwanLive-CloudStream-Repo/builds/repo.json
          TXT

      - name: Publish builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd publish
          git init
          git checkout -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build Alwan Live ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds
